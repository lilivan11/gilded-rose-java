group 'com.deg540'
version '1.0'

apply plugin: 'java'
apply plugin: 'jacoco'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    testCompile 'junit:junit:4.12'
    testCompile 'org.mockito:mockito-core:1.10.19'
}

test {
    testLogging {
        dependsOn cleanTest
        testLogging.showStandardStreams = true
        testLogging.exceptionFormat = 'full'
    }
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.5"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.enabled true
        html.enabled true
    }
    finalizedBy 'printCoverage'
}

task printCoverage {
    doLast {
        def reportFile = file("$buildDir/reports/jacoco/test/jacocoTestReport.xml")
        if (!reportFile.exists()) {
            println "No se encontro el informe de Jacoco en ${reportFile}"
            return
        }
        def parser = new XmlSlurper(false, false)
        parser.setFeature("http://apache.org/xml/features/disallow-doctype-decl", false)
        parser.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)
        def report = parser.parse(reportFile)
        def counters = report.counter

        println ""
        println "======================= JaCoCo Code Coverage ======================="
        printf "%-12s %10s %10s %10s\n", "Type", "Covered", "Missed", "Coverage"
        counters.each { counter ->
            def type = counter.@type.text()
            def covered = counter.@covered.text() as Integer
            def missed = counter.@missed.text() as Integer
            def total = covered + missed
            def pct = total == 0 ? 0.0 : (covered * 100.0 / total)
            printf "%-12s %10d %10d %9.2f%%\n", type, covered, missed, pct
        }
        println "======================================================================"
    }
}